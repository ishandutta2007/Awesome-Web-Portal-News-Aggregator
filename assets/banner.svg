<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#gridPattern)"/>

  <!-- Dynamic Animated Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="280" r="160" fill="#f97316" opacity="0.12" filter="url(#glowOrange)">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Abstract Dynamic Feed Wave Graphs & Signals (Background elements) -->
  <path d="M 0 280 Q 300 200 600 270 T 1200 220" fill="none" stroke="url(#accentCyan)" stroke-width="2" stroke-opacity="0.25"/>
  <path d="M 0 240 Q 350 310 700 210 T 1200 260" fill="none" stroke="url(#accentOrange)" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- RSS Feed Waves Icon (Left Decorative Graphic) -->
  <g transform="translate(80, 110)">
    <circle cx="20" cy="120" r="16" fill="#f97316"/>
    <path d="M 20 60 A 76 76 0 0 1 96 136" fill="none" stroke="#f97316" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <path d="M 20 15 A 121 121 0 0 1 141 136" fill="none" stroke="#f97316" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- Top Category Pill -->
  <g transform="translate(260, 75)">
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="185" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">
      CURATED ECOSYSTEM • SAAS &amp; OPEN-SOURCE
    </text>
  </g>

  <!-- Main Title -->
  <text x="260" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Web Portal &amp; News Aggregator
  </text>

  <!-- Subtitle -->
  <text x="260" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Feed Readers, Personalized News Hubs &amp; Self-Hosted RSS Platforms
  </text>

  <!-- Key Feature Badges (Foreground Bottom) -->
  <g transform="translate(260, 245)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">🌐 Web Portals</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="195" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">📡 RSS Feed Readers</text>

    <!-- Badge 3 -->
    <rect x="370" y="0" width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="385" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">🏠 Self-Hosted Readers</text>
  </g>
</svg>
